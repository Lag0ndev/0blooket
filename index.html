<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blooket | Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Titan+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="https://www.blooket.com/favicon.ico" />
</head>
<body>
  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="sidebar-top">
      <img
        class="logo"
        height="43"
        width="168"
        alt="Blooket"
        src="https://dashboard.blooket.com/_next/image?url=https://ac.blooket.com/dashboard/4e10e84779aaa361fd4310c02366e37ebee7b60d/_next/static/media/Blooket.553ca753.png&w=384&q=75"
      />
      <ul class="nav-list">
        <li>
          <a class="nav-link active" id="nav-market" href="#" data-page="market">
            <span class="nav-icon">
              <svg aria-hidden="true" focusable="false" role="img" viewBox="0 0 616 512" xmlns="http://www.w3.org/2000/svg">
                <path d="M602 118.6L537.1 15C531.3 5.7 521 0 510 0H106C95 0 84.7 5.7 78.9 15L14 118.6c-33.5 53.5-3.8 127.9 58.8 136.4 4.5.6 9.1.9 13.7.9 29.6 0 55.8-13 73.8-33.1 18 20.1 44.3 33.1 73.8 33.1 29.6 0 55.8-13 73.8-33.1 18 20.1 44.3 33.1 73.8 33.1 29.6 0 55.8-13 73.8-33.1 18.1 20.1 44.3 33.1 73.8 33.1 4.7 0 9.2-.3 13.7-.9 62.8-8.4 92.6-82.8 59-136.4zM529.5 288c-10 0-19.9-1.5-29.5-3.8V384H116v-99.8c-9.6 2.2-19.5 3.8-29.5 3.8-6 0-12.1-.4-18-1.2-5.6-.8-11.1-2.1-16.4-3.6V480c0 17.7 14.3 32 32 32h448c17.7 0 32-14.3 32-32V283.2c-5.4 1.6-10.8 2.9-16.4 3.6-6.1.8-12.1 1.2-18.2 1.2z" fill="currentColor"/>
              </svg>
            </span>
            <span class="nav-text">Market</span>
          </a>
        </li>
        <li>
          <a class="nav-link" id="nav-blooks" href="#" data-page="blooks">
            <span class="nav-icon">
              <svg aria-hidden="true" focusable="false" role="img" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
                <path d="M128 480h256V80c0-26.5-21.5-48-48-48H176c-26.5 0-48 21.5-48 48v400zm64-384h128v32H192V96zm320 80v256c0 26.5-21.5 48-48 48h-48V128h48c26.5 0 48 21.5 48 48zM96 480H48c-26.5 0-48-21.5-48-48V176c0-26.5 21.5-48 48-48h48v352z" fill="currentColor"/>
              </svg>
            </span>
            <span class="nav-text">Blooks</span>
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main" id="main">
    <div class="bg-blooks"></div>
    <h1 class="page-header" id="page-header">Market</h1>

    <!-- Market page -->
    <div class="packs-row" id="packs-row">
      <div class="pack-card" id="spooky-pack" role="button" tabindex="0">
        <div class="pack-img-container">
          <img class="pack-shadow" height="80" width="80" alt="" draggable="false"
            src="https://ac.blooket.com/blookassets/packs/icons/spooky.svg" />
          <img class="pack-img" height="165" width="150" alt="Spooky" draggable="false"
            src="https://ac.blooket.com/blookassets/packs/spooky.png" />
        </div>
        <div class="pack-bottom">
          <img class="pack-price-icon" height="23" width="23" alt="" draggable="false"
            src="https://ac.blooket.com/dashboard/4e10e84779aaa361fd4310c02366e37ebee7b60d/_next/static/media/token.8de4e1b8.svg" />
          25
        </div>
        <div class="pack-overlay"></div>
      </div>
    </div>

    <!-- Blooks page (My Blooks) – all locked -->
    <div class="blooks-page hidden" id="blooks-page">
      <div class="blooks-packs-container" id="blooks-packs-container">
        <!-- Filled by JS: every blook locked -->
      </div>
    </div>

    <div class="watermark">Lag0n</div>
  </main>

  <!-- Purchase Modal -->
  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="purchase-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button type="button" class="modal-close" id="modal-close" aria-label="Close">
        <svg aria-hidden="true" focusable="false" viewBox="0 0 352 512" width="14" height="20">
          <path fill="currentColor" d="M242.72 256l100.07-100.07c12.28-12.28 12.28-32.19 0-44.48l-22.24-22.24c-12.28-12.28-32.19-12.28-44.48 0L176 189.28 75.93 89.21c-12.28-12.28-32.19-12.28-44.48 0L9.21 111.45c-12.28 12.28-12.28 32.19 0 44.48L109.28 256 9.21 356.07c-12.28 12.28-12.28 32.19 0 44.48l22.24 22.24c12.28 12.28 32.2 12.28 44.48 0L176 322.72l100.07 100.07c12.28 12.28 32.2 12.28 44.48 0l22.24-22.24c12.28-12.28 12.28-32.19 0-44.48L242.72 256z"/>
        </svg>
      </button>
      <div class="modal-body">
        <div class="modal-pack-preview">
          <div class="modal-pack-img-wrap">
            <img class="modal-pack-shadow" alt="" draggable="false"
              src="https://ac.blooket.com/blookassets/packs/icons/spooky.svg" />
            <img class="modal-pack-img" alt="Spooky" draggable="false"
              src="https://ac.blooket.com/blookassets/packs/spooky.png" />
          </div>
          <div class="modal-pack-overlay"></div>
        </div>
        <div class="modal-form">
          <div class="modal-info">
            <h2 class="modal-title" id="modal-title">Spooky Pack</h2>
            <button type="button" class="row-btn" id="drop-rates-btn">Show Drop Rates</button>
            <div class="modal-tags">
              <span class="price-tag">
                <img height="19" width="18" alt="Token"
                  src="https://ac.blooket.com/dashboard/4e10e84779aaa361fd4310c02366e37ebee7b60d/_next/static/media/token.8de4e1b8.svg" />
                25
              </span>
            </div>
          </div>
          <div class="modal-buy">
            <div class="qty-row">
              Purchase Quantity:
              <input type="number" id="qty-input" name="quantity" min="1" max="100" value="1" autocomplete="off" />
            </div>
            <div class="btn-row">
              <button type="button" class="row-btn" data-qty="-1" id="btn-minus" disabled>− 1</button>
              <button type="button" class="row-btn" data-qty="+1">+ 1</button>
              <button type="button" class="row-btn" data-qty="+5">+ 5</button>
              <button type="button" class="row-btn" data-qty="+10">+ 10</button>
            </div>
            <div class="btn-row">
              <button type="button" class="row-btn set-qty" data-set="1" disabled>1</button>
              <button type="button" class="row-btn set-qty" data-set="5">5</button>
              <button type="button" class="row-btn set-qty" data-set="10">10</button>
              <button type="button" class="row-btn set-qty" data-set="25">25</button>
              <button type="button" class="row-btn set-qty" data-set="50">50</button>
              <button type="button" class="row-btn set-qty" data-set="100">100</button>
              <button type="button" class="row-btn" id="btn-reset" disabled title="Reset">↻</button>
            </div>
            <button type="button" class="buy-btn" id="buy-btn">
              <div class="buy-btn-back"></div>
              <div class="buy-btn-front">
                <span class="buy-btn-content">
                  <span>Buy <span id="buy-qty">1</span> for </span>
                  <span class="buy-price-wrap">
                    <img class="buy-token" height="25" width="24" alt="Token"
                      src="https://ac.blooket.com/dashboard/4e10e84779aaa361fd4310c02366e37ebee7b60d/_next/static/media/token.8de4e1b8.svg" />
                    <b id="buy-price">25</b>
                  </span>
                </span>
              </div>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="blooks_data.js"></script>
  <script src="script.js"></script>
</body>
</html>
